<div class="container">
    <h2 class="mb-4">Lista de Usuarios</h2>

    <div class="row">
        <!-- Fixing error not loading home + cdr in home.ts -->
        <div *ngIf="users.length === 0" class="alert alert-info">
            <p>Cargando usuarios o lista vacía...</p>
        </div>
        <div class="col-md-4 mb-3" *ngFor="let user of users">
            <div class="card p-3 text-center">
                <img [src]="user.image" alt="Avatar" class="rounded-circle mx-auto mb-3" style="width: 80px; height: 80px; object-fit: cover;">
                <h5>{{ user.first_name }} {{ user.last_name }}</h5>
                <p class="text-muted">{{ user.email }}</p>
                <button class="btn btn-danger btn-sm mt-2" (click)="deleteUser(user._id)"> Eliminar </button>
            </div>
        </div>
    </div>
</div>
